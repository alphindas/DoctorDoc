[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doctordoc"
version = "0.1.0"
description = "One door for any document: detect, route to the best engine per page, extract fields with proof."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pypdfium2>=4.30",   # Apache-2.0 / BSD: PDF text + page rendering
    "pillow>=10",
    "python-docx>=1.1",  # MIT
    "openpyxl>=3.1",     # MIT
    "python-pptx>=0.6.23",  # MIT
]

[project.optional-dependencies]
docling = ["docling>=2.0"]                      # MIT
ocr = ["rapidocr>=3.0", "onnxruntime>=1.17"]    # Apache-2.0
paddle = ["paddleocr>=3.0", "paddlepaddle>=3.0"]  # Apache-2.0
markitdown = ["markitdown[docx,pptx,xlsx]>=0.1"]  # MIT
msg = ["olefile>=0.46"]  # BSD-2: read attachments of Outlook .msg files
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
ui = ["streamlit>=1.67"]  # tabs that remember the open tab (key + on_change)
# Optional plugins with restrictive licenses -- read the README license table first.
marker = ["marker-pdf"]   # model weights: revenue/funding limits for commercial use
mineru = ["mineru"]       # custom license with conditions
all = ["doctordoc[docling,ocr,paddle,markitdown,api,ui]"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "reportlab>=4", "types-PyYAML"]

[project.scripts]
doctordoc = "doctordoc.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/doctordoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs an optional engine installed (skipped if missing)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"src/doctordoc/ui/*" = ["E501"]  # long lines are HTML and CSS strings

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
